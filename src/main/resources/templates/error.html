<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: rgba(0, 0, 0, 0.45);
            padding: 40px;
            border-radius: 14px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 64px;
            margin: 0;
            color: #ff6b6b;
        }

        h2 {
            margin: 12px 0;
            font-weight: 600;
        }

        p {
            opacity: 0.85;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        a {
            text-decoration: none;
            color: #ffffff;
            background: #ff6b6b;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        a:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>⚠</h1>
    <h2>Something went wrong</h2>
    <p>
        An unexpected error occurred.<br>
        Please try again later or contact support if the problem persists.
    </p>
    <p>
        It is Stalbek's server please do not abuse it)
    </p>
    <a href="/">Go back home</a>
</div>
</body>
</html>
