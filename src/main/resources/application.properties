spring.application.name=Sana
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
ai.provider=${AI_PROVIDER:deepseek}
deepseek.apikey=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
deepseek.url=${DEEPSEEK_URL:https://api.deepseek.com/chat/completions}
deepseek.thinking-enabled=${DEEPSEEK_THINKING_ENABLED:false}
openai.apikey=${OPENAI_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.4}
openai.url=${OPENAI_URL:https://api.openai.com/v1/responses}
openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
elevenlabs.apikey=${ELEVENLABS_API_KEY:}
ai.stt.model=${AI_STT_MODEL:scribe_v2}
ai.stt.realtime-model=${AI_STT_REALTIME_MODEL:scribe_v2_realtime}
ai.stt.language-code=${AI_STT_LANGUAGE_CODE:}
ai.stt.max-keyterms=${AI_STT_MAX_KEYTERMS:100}
ai.limits.mode=${AI_LIMITS_MODE:enforce}
ai.limits.primary-submissions-per-minute=${AI_LIMITS_PRIMARY_SUBMISSIONS_PER_MINUTE:10}
ai.limits.operations-per-minute=${AI_LIMITS_OPERATIONS_PER_MINUTE:20}
ai.limits.units-per-minute=${AI_LIMITS_UNITS_PER_MINUTE:50}
ai.limits.units-per-hour=${AI_LIMITS_UNITS_PER_HOUR:500}
ai.limits.realtime-tokens-per-hour=${AI_LIMITS_REALTIME_TOKENS_PER_HOUR:100}
ai.limits.concurrent-operations=${AI_LIMITS_CONCURRENT_OPERATIONS:2}
ai.limits.concurrent-retry-seconds=${AI_LIMITS_CONCURRENT_RETRY_SECONDS:1}
ai.limits.text-max-characters=${AI_LIMITS_TEXT_MAX_CHARACTERS:2000}
ai.limits.upload-max-bytes=${AI_LIMITS_UPLOAD_MAX_BYTES:10485760}
ai.limits.cleanup-after-minutes=${AI_LIMITS_CLEANUP_AFTER_MINUTES:65}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.postgresql.transactional-lock=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
server.error.whitelabel.enabled=false
walletwallet.base-url=${WALLETWALLET_BASE_URL:https://api.walletwallet.dev}
walletwallet.api-key=${WALLETWALLET_API_KEY:}
walletwallet.connect-timeout=${WALLETWALLET_CONNECT_TIMEOUT:5s}
walletwallet.read-timeout=${WALLETWALLET_READ_TIMEOUT:30s}
walletwallet.max-request-bytes=${WALLETWALLET_MAX_REQUEST_BYTES:2097152}
walletwallet.attempts-per-hour=${WALLETWALLET_ATTEMPTS_PER_HOUR:10}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
